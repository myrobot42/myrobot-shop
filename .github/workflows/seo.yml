name: Build SEO pages

# Runs ONCE DAILY (not on every data change) so a batch of image/robot
# updates produces a single SEO rebuild instead of hundreds.
on:
  schedule:
    - cron: '0 4 * * *'   # daily at 04:00 UTC
  workflow_dispatch:        # plus a manual "Run workflow" button

# Only one run at a time — prevents the concurrent-push collisions that
# caused the "Run failed" emails.
concurrency:
  group: seo-pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate robot pages + sitemap
        run: node seo/build-seo.js

      - name: Commit and push
        run: |
          git config user.name "seo-bot"
          git config user.email "seo-bot@users.noreply.github.com"
          git add r/ sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes."
          else
            # [skip ci] stops this commit from triggering a Netlify deploy
            git commit -m "SEO: regenerate robot pages + sitemap [skip ci]"
            git push
          fi
