name: Build SEO pages

on:
  push:
    paths:
      - 'data/robots.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate robot pages + sitemap
        run: node seo/build-seo.js

      - name: Commit and push
        run: |
          git config user.name "seo-bot"
          git config user.email "seo-bot@users.noreply.github.com"
          git add r/ sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "SEO: regenerate robot pages + sitemap"
            git push
          fi
