# netlify.toml

# Regenerate all per-robot SEO pages (/r/*.html), /questions pages + sitemap.xml
# from data/robots.json and data/questions.json on every deploy.
[build]
  command = "node generate-pages.js"
  publish = "."

# Pin Node so the build uses a modern runtime (older defaults can fail the build).
[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "zisi"

[functions."admin-page"]
  included_files = ["admin-app.html"]

[functions."chat"]
  timeout = 26

[functions."trends-refresh"]
  timeout = 120

[functions."news-refresh"]
  schedule = "0 5 * * *"   # daily 05:00 UTC = 15:00 Brisbane
  timeout = 60

[functions."videos-refresh"]
  schedule = "10 5 * * *"  # daily 05:10 UTC = 15:10 Brisbane
  timeout = 30

# IMPORTANT: the /api/chat redirect MUST come BEFORE the catch-all below,
# or every request (including /api/chat) gets sent to index.html.
# Admin portal: served only to approved Google accounts (force = true overrides any static file).
[[redirects]]
  from = "/admin"
  to = "/.netlify/functions/admin-page"
  status = 200
  force = true

[[redirects]]
  from = "/admin.html"
  to = "/.netlify/functions/admin-page"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth-google"
  to = "/.netlify/functions/auth-google"
  status = 200

[[redirects]]
  from = "/api/auth-session"
  to = "/.netlify/functions/auth-session"
  status = 200

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/views"
  to = "/.netlify/functions/views"
  status = 200

# SPA catch-all — sends everything else to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
